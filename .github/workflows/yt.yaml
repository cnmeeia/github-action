name: 4K Download & Upload & Notify

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '需要下载的视频 URL'
        required: true
        default: 'https://www.youtube.com/watch?v=YOUR_ID'

jobs:
  process-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ffmpeg: true

      # Step 1：下载 4K 视频（最高码率）
      - name: Download video with yt-dlp
        id: download
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p downloads
          cd downloads
          yt-dlp -f "bv*+ba/b" --merge-output-format mp4 "${VIDEO_URL}"
          
          # 获取文件名
          FILE=$(ls -1 *.mp4 | head -1)
          echo "filename=${FILE}" >> "$GITHUB_OUTPUT"
          echo "Downloaded: ${FILE}"
          ls -lh "${FILE}"

      # Step 2：上传到 Artifacts
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4k-video
          path: downloads/*.mp4
          retention-days: 7
          compression-level: 0  
