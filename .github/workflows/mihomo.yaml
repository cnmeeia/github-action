name: Build macOS ARM64 DMG

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:

    runs-on: macos-latest

    steps:

      - name: Checkout source
        run: |
          git clone \
          --depth=1 \
          --branch "${GITHUB_REF_NAME}" \
          https://cnb.cool/cnmeeia/mihomo.git mihomo


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22




      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin


      - name: Check Environment
        run: |
          node -v
          npm -v
          rustc --version
          xcodebuild -version


      - name: Install dependencies
        run: |
          cd mihomo
          npm ci


      - name: Build DMG
        run: |
          cd mihomo
          npm run app:build


      - name: Find DMG
        run: |
          find mihomo -name "*.dmg"


      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-macos-arm64
          path: mihomo/**/*.dmg
          retention-days: 30