name: Build macOS M1 mihomo

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14

    steps:
      # =====================
      # Checkout Repository
      # =====================
      - name: Checkout
        uses: actions/checkout@v4

      # =====================
      # Clone mihomo
      # =====================
      - name: Clone mihomo
        run: |
          git clone https://cnb.cool/cnmeeia/mihomo mihomo
          cd mihomo
          git checkout "${GITHUB_REF_NAME}"
          git rev-parse --short HEAD
          ls -la

      # =====================
      # Setup Environment
      # =====================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mihomo/src-tauri"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mihomo/package-lock.json

      # =====================
      # Install Dependencies
      # =====================
      - name: Install npm dependencies
        working-directory: mihomo
        run: npm ci

      - name: Install macOS tools
        run: brew install create-dmg

      # =====================
      # Build Helper & Kernel
      # =====================
      - name: Build Helper Tool
        working-directory: mihomo
        run: |
          # --- 修复 1：MihomoHelper (daemon) ---
          sed -i '' 's/let socketAddr = sockaddr_un/var socketAddr = sockaddr_un/g' xcode/MihomoHelper/MihomoHelper.swift
          sed -i '' 's/process.terminateSignal = SIGUSR1/\/\/ process.terminateSignal = SIGUSR1/g' xcode/MihomoHelper/MihomoHelper.swift
          
          # --- 修复 2：mihomo-helperctl (CLI) ---
          sed -i '' 's/let addr = sockaddr_un/var addr = sockaddr_un/g' xcode/MihomoHelper/mihomo-helperctl.swift
          sed -i '' 's/let request = \["kind"/let request: [String: Any] = ["kind"/g' xcode/MihomoHelper/mihomo-helperctl.swift
          
          bash scripts/build-helper.sh src-tauri/resources
          ls -lh src-tauri/resources/mihomo-helper src-tauri/resources/mihomo-helperctl

      - name: Fetch mihomo kernel
        working-directory: mihomo
        run: bash scripts/fetch-kernel.sh

      # =====================
      # Fix Cargo.toml
      # =====================
      - name: Patch Cargo.toml default-run
        working-directory: mihomo/src-tauri
        run: |
          # 1. 动态提取 Cargo.toml 中的包名
          PKG_NAME=$(grep -m 1 '^name = ' Cargo.toml | cut -d '"' -f 2)
          echo "Found package name: $PKG_NAME"
          
          # 2. 使用 sed 动态插入 default-run 参数
          sed -i '' "/\[package\]/a\\
          default-run = \"$PKG_NAME\"
          " Cargo.toml
          
          # 3. 打印前 15 行确认修改成功
          head -n 15 Cargo.toml

      # =====================
      # Build Tauri App
      # =====================
      - name: Build Tauri
        working-directory: mihomo
        run: npm run app:build

      # =====================
      # Verification
      # =====================
      - name: List output
        working-directory: mihomo
        run: find src-tauri/target/release/bundle -type f

      # =====================
      # Upload Artifact & Release
      # =====================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-macos-arm64
          path: |
            mihomo/src-tauri/target/release/bundle/macos/*.app
            mihomo/src-tauri/target/release/bundle/dmg/*.dmg
            mihomo/src-tauri/target/release/bundle/macos/*.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mihomo/src-tauri/target/release/bundle/dmg/*.dmg
            mihomo/src-tauri/target/release/bundle/macos/*.tar.gz
