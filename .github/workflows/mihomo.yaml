name: Build macOS M1 mihomo

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14

    steps:
      # =====================
      # Checkout Repository
      # =====================
      - name: Checkout
        uses: actions/checkout@v4

      # =====================
      # Clone mihomo
      # =====================
      - name: Clone mihomo
        run: |
          git clone https://cnb.cool/cnmeeia/mihomo mihomo
          cd mihomo
          git checkout "${GITHUB_REF_NAME}"
          git rev-parse --short HEAD
          ls -la

      # =====================
      # Setup Environment
      # =====================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        # 注: macos-14 是原生 ARM64 机器，默认 target 即为 aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mihomo/src-tauri"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mihomo/package-lock.json

      # =====================
      # Install Dependencies
      # =====================
      - name: Install npm dependencies
        working-directory: mihomo
        run: npm ci

      - name: Install macOS tools
        run: brew install create-dmg

      # =====================
      # Build Helper & Kernel
      # =====================
      - name: Build Helper Tool
        working-directory: mihomo
        run: |
          # 源码已修复，直接执行编译脚本即可
          bash scripts/build-helper.sh src-tauri/resources
          
          # 列出产物确认编译成功
          ls -lh src-tauri/resources/mihomo-helper src-tauri/resources/mihomo-helperctl

      - name: Fetch mihomo kernel
        working-directory: mihomo
        run: bash scripts/fetch-kernel.sh

      # =====================
      # Build Tauri App
      # =====================
      - name: Build Tauri
        working-directory: mihomo
        run: npm run app:build

      # =====================
      # Verification
      # =====================
      - name: List output
        working-directory: mihomo
        run: find src-tauri/target/release/bundle -type f

      # =====================
      # Upload Artifact & Release
      # =====================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-macos-arm64
          path: |
            mihomo/src-tauri/target/release/bundle/macos/*.app
            mihomo/src-tauri/target/release/bundle/dmg/*.dmg
            mihomo/src-tauri/target/release/bundle/macos/*.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mihomo/src-tauri/target/release/bundle/dmg/*.dmg
            mihomo/src-tauri/target/release/bundle/macos/*.tar.gz
