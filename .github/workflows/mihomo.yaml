name: Build macOS M1 mihomo

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  build-macos-arm64:

    runs-on: macos-14


    steps:


      # =====================
      # Checkout
      # =====================
      - name: Checkout
        uses: actions/checkout@v4



      # =====================
      # Clone mihomo
      # =====================
      - name: Clone mihomo
        run: |
          git clone https://cnb.cool/cnmeeia/mihomo mihomo

          cd mihomo

          git checkout "${GITHUB_REF_NAME}"

          git rev-parse --short HEAD

          ls -la



      # =====================
      # Rust
      # =====================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable



      - name: Install Rust target
        run: |
          rustup target add aarch64-apple-darwin



      # =====================
      # Node
      # =====================
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mihomo/package-lock.json



      # =====================
      # npm
      # =====================
      - name: Install dependencies
        working-directory: mihomo
        run: |
          npm ci



      # =====================
      # tools
      # =====================
      - name: Install tools
        run: |
          brew install create-dmg



      # =====================
      # helper
      # =====================
      - name: Build Helper Tool
        working-directory: mihomo
        run: |

          bash scripts/build-helper.sh src-tauri/resources


          ls -lh \
          src-tauri/resources/mihomo-helper \
          src-tauri/resources/mihomo-helperctl


          rm -f \
          src-tauri/resources/mihomo-helper \
          src-tauri/resources/mihomo-helperctl



      # =====================
      # kernel
      # =====================
      - name: Fetch mihomo kernel
        working-directory: mihomo
        run: |

          bash scripts/fetch-kernel.sh



      # =====================
      # Tauri
      # =====================
      - name: Build Tauri
        working-directory: mihomo
        run: |

          npm run app:build



      # =====================
      # output
      # =====================
      - name: List output
        working-directory: mihomo
        run: |

          find src-tauri/target/release/bundle -type f



      # =====================
      # artifact
      # =====================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:

          name: mihomo-macos-arm64

          path: |
            mihomo/src-tauri/target/release/bundle/macos/*.app
            mihomo/src-tauri/target/release/bundle/dmg/*.dmg
            mihomo/src-tauri/target/release/bundle/macos/*.tar.gz



      # =====================
      # release
      # =====================
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:

          files: |
            mihomo/src-tauri/target/release/bundle/dmg/*.dmg
            mihomo/src-tauri/target/release/bundle/macos/*.tar.gz