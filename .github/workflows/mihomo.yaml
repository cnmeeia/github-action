name: Build macOS M1 ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: macOS ARM64 - M1/M2/M3/M4
    runs-on: macos-14

    env:
      CNB_USER: $CNB_USER"
      CNB_PASSWORD: ${{ secrets.CNB_PASSWORD }}
      CNB_URL: https://api.cnb.cool/cnmeeia/new-mihomo/-/git/archive/refs/heads/auto/mihomo-gui-f1b5.zip

    steps:

      # ============================================
      # 1. 检查 macOS Runner
      # ============================================
      - name: Check macOS
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "System"
          echo "======================================"

          sw_vers
          uname -a

          echo
          echo "Architecture:"
          uname -m

      # ============================================
      # 2. 检查 CNB Secrets
      # ============================================
      - name: Check CNB credentials
        shell: bash
        run: |
          set -e

          if [ -z "$CNB_USER" ]; then
            echo "ERROR: CNB_USER is empty"
            exit 1
          fi

          if [ -z "$CNB_PASSWORD" ]; then
            echo "ERROR: CNB_PASSWORD is empty"
            exit 1
          fi

          echo "CNB_USER: $CNB_USER"
          echo "CNB_PASSWORD length: ${#CNB_PASSWORD}"

      # ============================================
      # 3. 下载 CNB 源码
      # ============================================
      - name: Download source from CNB
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Download source"
          echo "======================================"

          rm -f source.zip

          wget \
            --auth-no-challenge \
            --user="$CNB_USER" \
            --password="$CNB_PASSWORD" \
            --output-document=source.zip \
            "$CNB_URL"

          echo
          echo "Download completed:"
          ls -lh source.zip

          echo
          echo "File type:"
          file source.zip

      # ============================================
      # 4. 检查 ZIP
      # ============================================
      - name: Validate ZIP
        shell: bash
        run: |
          set -e

          unzip -t source.zip

      # ============================================
      # 5. 解压
      # ============================================
      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q source.zip -d source

          echo "Extracted files:"
          find source -maxdepth 2 -type f | head -100

      # ============================================
      # 6. 自动寻找 package.json
      # ============================================
      - name: Detect project directory
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/package.json" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/source" \
              -name package.json \
              -not -path "*/node_modules/*" \
              -type f
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "======================================"
          echo "Project directory"
          echo "======================================"

          echo "$PROJECT_DIR"

          echo
          echo "Project files:"
          ls -lah "$PROJECT_DIR"

      # ============================================
      # 7. Setup Node.js
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================
      # 8. Setup pnpm
      # ============================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ============================================
      # 9. Setup Rust
      # ============================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # ============================================
      # 10. Rust Cache
      # ============================================
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.PROJECT_DIR }}/src-tauri

      # ============================================
      # 11. 检查 Node / pnpm / Rust
      # ============================================
      - name: Check build environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Node"
          echo "======================================"

          node --version

          echo
          echo "======================================"
          echo "pnpm"
          echo "======================================"

          pnpm --version

          echo
          echo "======================================"
          echo "Rust"
          echo "======================================"

          rustc --version
          cargo --version

          echo
          echo "======================================"
          echo "Rust targets"
          echo "======================================"

          rustup target list --installed

      # ============================================
      # 12. 检查 package.json
      # ============================================
      - name: Show package scripts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "package.json:"
          cat package.json

      # ============================================
      # 13. 安装 pnpm 依赖
      # ============================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found"

            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml not found"

            pnpm install
          fi

      # ============================================
      # 14. 检查 Tauri
      # ============================================
      - name: Check Tauri project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -d "src-tauri" ]; then
            echo "ERROR: src-tauri directory not found"
            exit 1
          fi

          if [ ! -f "src-tauri/Cargo.toml" ]; then
            echo "ERROR: src-tauri/Cargo.toml not found"
            exit 1
          fi

          echo "Tauri project detected"

          echo
          echo "Cargo.toml:"
          cat src-tauri/Cargo.toml

      # ============================================
      # 15. 前端构建
      # ============================================
      - name: Build frontend
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building frontend"
          echo "======================================"

          pnpm build

      # ============================================
      # 16. 编译 Tauri ARM64
      # ============================================
      - name: Build Tauri ARM64
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building Tauri"
          echo "Target: aarch64-apple-darwin"
          echo "======================================"

          pnpm tauri build \
            --target aarch64-apple-darwin

      # ============================================
      # 17. 查看最终文件
      # ============================================
      - name: List build artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Build output"
          echo "======================================"

          TARGET_DIR="src-tauri/target/aarch64-apple-darwin"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: Target directory not found"
            exit 1
          fi

          find "$TARGET_DIR" \
            -maxdepth 6 \
            -type f \
            -print

      # ============================================
      # 18. 验证 ARM64
      # ============================================
      - name: Verify ARM64 binary
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Verify ARM64"
          echo "======================================"

          TARGET_DIR="src-tauri/target/aarch64-apple-darwin/release"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: Release directory not found"
            exit 1
          fi

          find "$TARGET_DIR" \
            -type f \
            -perm -111 \
            -maxdepth 3 \
            -exec file {} \; \
            || true

      # ============================================
      # 19. 上传完整构建结果
      # ============================================
      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-gui-macos-arm64
          path: |
            ${{ env.PROJECT_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/**
          if-no-files-found: warn
          retention-days: 30

      # ============================================
      # 20. 上传 DMG
      # ============================================
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-gui-macos-arm64-dmg
          path: |
            ${{ env.PROJECT_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 30

      # ============================================
      # 21. 上传 APP
      # ============================================
      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-gui-macos-arm64-app
          path: |
            ${{ env.PROJECT_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 30