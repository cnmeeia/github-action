name: Hako Client Build

on:
  push:
    branches:
      - main
      - master
      - auto/hako-macos-swift
  pull_request:
    branches:
      - main
      - master
      - auto/hako-macos-swift
  workflow_dispatch:
    inputs:
      mihomo_version:
        description: "Mihomo version tag (e.g. v1.19.30). Leave empty for latest."
        required: false
        default: ""
      configuration:
        description: "Xcode build configuration"
        required: false
        type: choice
        options:
          - Debug
          - Release
        default: Release

permissions:
  contents: read

env:
  PROJECT: HakoClient.xcodeproj
  SCHEME: HakoClient
  CONFIGURATION: ${{ inputs.configuration || 'Release' }}
  CORE_DIR: Core/mihomo
  BUILD_DIR: build
  DIST_DIR: dist

jobs:
  build-hakoclient:
    name: Build Hako Client (arm64)
    runs-on: macos-latest

    defaults:
      run:
        working-directory: HakoClient

    steps:
      # --------------------------------------------------------
      # Checkout 正确分支
      # --------------------------------------------------------
      - name: Checkout Hako Client
        uses: actions/checkout@v4
        with:
          ref: auto/hako-macos-swift

      # --------------------------------------------------------
      # Prepare directories
      # --------------------------------------------------------
      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CORE_DIR}/arm64" "${DIST_DIR}" "${BUILD_DIR}"
          echo "Workspace contents:"
          ls -la
          test -f "${PROJECT}"

      # --------------------------------------------------------
      # Download Mihomo binary (darwin-arm64)
      # --------------------------------------------------------
      - name: Download Mihomo darwin-arm64
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Download Mihomo binary"
          echo "========================================"

          if [ -n "${{ inputs.mihomo_version }}" ]; then
            TAG="${{ inputs.mihomo_version }}"
            echo "Using specified version: ${TAG}"
          else
            echo "Fetching latest release tag..."
            TAG=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
            echo "Latest tag: ${TAG}"
          fi

          ASSET_URL=$(gh api "repos/MetaCubeX/mihomo/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | test("mihomo-darwin-arm64.*\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "${ASSET_URL}" ]; then
            echo "ERROR: No mihomo-darwin-arm64 *.gz asset found for tag ${TAG}"
            echo "Available assets:"
            gh api "repos/MetaCubeX/mihomo/releases/tags/${TAG}" --jq '.assets[].name'
            exit 1
          fi

          echo "Downloading: ${ASSET_URL}"
          curl -L --fail --retry 3 -o mihomo.gz "${ASSET_URL}"

          echo "Extracting..."
          gunzip -c mihomo.gz > "${CORE_DIR}/arm64/mihomo"
          chmod +x "${CORE_DIR}/arm64/mihomo"
          rm -f mihomo.gz

          echo
          echo "Installed binary:"
          ls -lah "${CORE_DIR}/arm64/mihomo"
          file "${CORE_DIR}/arm64/mihomo"
          file "${CORE_DIR}/arm64/mihomo" | grep -E "arm64|ARM64"

          echo
          echo "Mihomo version:"
          "${CORE_DIR}/arm64/mihomo" -v || true

          SHA256=$(shasum -a 256 "${CORE_DIR}/arm64/mihomo" | awk '{print $1}')
          cat > "${DIST_DIR}/mihomo-metadata.txt" <<EOF
          Hako Client Mihomo Core

          Source: MetaCubeX/mihomo (official release)
          Tag: ${TAG}
          Asset: ${ASSET_URL}
          Architecture: darwin/arm64
          SHA256: ${SHA256}
          Build Time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          EOF

          cat "${DIST_DIR}/mihomo-metadata.txt"

      # --------------------------------------------------------
      # Verify project
      # --------------------------------------------------------
      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          echo "Current directory: $(pwd)"
          ls -la
          test -f "${PROJECT}"
          test -x "${CORE_DIR}/arm64/mihomo"
          echo "Project and Mihomo binary OK"

      # --------------------------------------------------------
      # Xcode information
      # --------------------------------------------------------
      - name: Xcode information
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          echo
          echo "Available schemes:"
          xcodebuild -project "${PROJECT}" -list

      # --------------------------------------------------------
      # Clean
      # --------------------------------------------------------
      - name: Clean Xcode build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -sdk macosx \
            -derivedDataPath "${BUILD_DIR}/DerivedData" \
            clean

      # --------------------------------------------------------
      # Build (no Apple Developer account required)
      # --------------------------------------------------------
      - name: Build Hako Client
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "${BUILD_DIR}/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      # --------------------------------------------------------
      # Test
      # --------------------------------------------------------
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "${BUILD_DIR}/TestDerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test

      # --------------------------------------------------------
      # Locate app
      # --------------------------------------------------------
      - name: Locate HakoClient.app
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for HakoClient.app..."
          find "${BUILD_DIR}" -type d -name "HakoClient.app" -print

      # --------------------------------------------------------
      # Validate application
      # --------------------------------------------------------
      - name: Validate HakoClient.app
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find "${BUILD_DIR}/DerivedData/Build/Products" -type d -name "HakoClient.app" | head -n 1)
          if [ -z "${APP}" ]; then
            echo "ERROR: HakoClient.app not found"
            find "${BUILD_DIR}" -name "*.app" -print || true
            exit 1
          fi

          echo "App: ${APP}"
          echo
          echo "========================================"
          echo "Application"
          echo "========================================"
          ls -lah "${APP}"
          echo
          echo "========================================"
          echo "Executable"
          echo "========================================"
          file "${APP}/Contents/MacOS/HakoClient"
          echo
          echo "========================================"
          echo "Mihomo"
          echo "========================================"
          MIHOMO="${APP}/Contents/Resources/Core/mihomo/arm64/mihomo"
          if [ ! -f "${MIHOMO}" ]; then
            echo "ERROR: Mihomo was not bundled into the application"
            echo
            echo "Searching application bundle:"
            find "${APP}/Contents" -type f -name "mihomo" -print || true
            exit 1
          fi
          file "${MIHOMO}"
          file "${MIHOMO}" | grep -E "arm64|ARM64"
          test -x "${MIHOMO}"
          echo
          echo "Mihomo successfully bundled."

      # --------------------------------------------------------
      # Inspect bundle
      # --------------------------------------------------------
      - name: Inspect application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "${BUILD_DIR}/DerivedData/Build/Products" -type d -name "HakoClient.app" | head -n 1)
          echo "Bundle structure:"
          find "${APP}/Contents" -maxdepth 5 -print

      # --------------------------------------------------------
      # Code signing inspection (informational)
      # --------------------------------------------------------
      - name: Inspect code signature
        shell: bash
        run: |
          set +e
          APP=$(find "${BUILD_DIR}/DerivedData/Build/Products" -type d -name "HakoClient.app" | head -n 1)
          codesign --display --verbose=4 "${APP}" || true

      # --------------------------------------------------------
      # Package application
      # --------------------------------------------------------
      - name: Package Hako Client
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find "${BUILD_DIR}/DerivedData/Build/Products" -type d -name "HakoClient.app" | head -n 1)
          if [ -z "${APP}" ]; then
            echo "ERROR: HakoClient.app not found"
            exit 1
          fi

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${APP}/Contents/Info.plist" 2>/dev/null || echo "0.1")
          ARCH="arm64"
          ZIP_NAME="HakoClient-v${VERSION}-macOS-${ARCH}.zip"

          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${DIST_DIR}/${ZIP_NAME}"
          echo "Created:"
          ls -lh "${DIST_DIR}/${ZIP_NAME}"

      # --------------------------------------------------------
      # SHA256
      # --------------------------------------------------------
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "${DIST_DIR}"
          shasum -a 256 *.zip > SHA256SUMS
          cat SHA256SUMS

      # --------------------------------------------------------
      # Build metadata
      # --------------------------------------------------------
      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find "${BUILD_DIR}/DerivedData/Build/Products" -type d -name "HakoClient.app" | head -n 1)
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${APP}/Contents/Info.plist" 2>/dev/null || echo "unknown")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "${APP}/Contents/Info.plist" 2>/dev/null || echo "unknown")

          cat > "${DIST_DIR}/build-metadata.txt" <<EOF
          Hako Client Build

          Application: HakoClient
          Version: ${APP_VERSION}
          Build: ${APP_BUILD}
          Configuration: ${CONFIGURATION}
          Architecture: arm64
          Platform: macOS
          Mihomo: official prebuilt darwin-arm64
          Signing: Unsigned
          Apple Developer Program: Not required for v0.1 build
          Build Time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          EOF

          cat "${DIST_DIR}/build-metadata.txt"

      # --------------------------------------------------------
      # Upload final artifact
      # --------------------------------------------------------
      - name: Upload Hako Client artifact
        uses: actions/upload-artifact@v4
        with:
          name: hako-client-macos-arm64
          path: |
            HakoClient/dist/*.zip
            HakoClient/dist/SHA256SUMS
            HakoClient/dist/build-metadata.txt
            HakoClient/dist/mihomo-metadata.txt
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------
      # Upload diagnostics if build fails
      # --------------------------------------------------------
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hako-client-build-diagnostics
          path: |
            HakoClient/build/
            HakoClient/Core/mihomo/
          if-no-files-found: ignore
          retention-days: 7