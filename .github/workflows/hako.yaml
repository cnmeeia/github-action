name: Hako Client Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      mihomo_ref:
        description: "Mihomo branch / tag"
        required: false
        default: "main"
      configuration:
        description: "Xcode build configuration"
        required: false
        type: choice
        options:
          - Debug
          - Release
        default: Release

permissions:
  contents: read

env:
  # ------------------------------------------------------------
  # Project
  # ------------------------------------------------------------
  PROJECT: HakoClient.xcodeproj
  SCHEME: HakoClient

  # ------------------------------------------------------------
  # Build
  # ------------------------------------------------------------
  CONFIGURATION: ${{ inputs.configuration || 'Release' }}

  # ------------------------------------------------------------
  # Mihomo
  # ------------------------------------------------------------
  MIHOMO_REPOSITORY: https://cnb.cool/cnmeeia/mihomo.git
  MIHOMO_REF: ${{ inputs.mihomo_ref || 'main' }}

  MIHOMO_SOURCE: .build/mihomo
  CORE_DIR: Core/mihomo

  # ------------------------------------------------------------
  # Output
  # ------------------------------------------------------------
  BUILD_DIR: build
  DIST_DIR: dist

jobs:
  # ============================================================
  # 1. Build Mihomo arm64
  # ============================================================
  build-mihomo:
    name: Build Mihomo arm64
    runs-on: macos-latest

    steps:
      # --------------------------------------------------------
      # Checkout Hako Client
      # --------------------------------------------------------
      - name: Checkout Hako Client
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Prepare directories
      # --------------------------------------------------------
      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "${MIHOMO_SOURCE}" \
            "${CORE_DIR}/arm64" \
            "${DIST_DIR}"

      # --------------------------------------------------------
      # Clone Mihomo from CNB
      # --------------------------------------------------------
            # --------------------------------------------------------
      # Clone Mihomo from CNB
      # --------------------------------------------------------
      - name: Clone Mihomo from CNB
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "Clone Mihomo"
          echo "========================================"
          echo "Repository: ${MIHOMO_REPOSITORY}"
          echo "Ref: ${MIHOMO_REF}"

          # 清理可能存在的目录，避免 git clone 到非空目录
          rm -rf "${MIHOMO_SOURCE}"
          mkdir -p "$(dirname "${MIHOMO_SOURCE}")"

          git clone \
            --depth=1 \
            --branch "${MIHOMO_REF}" \
            "${MIHOMO_REPOSITORY}" \
            "${MIHOMO_SOURCE}"

          cd "${MIHOMO_SOURCE}"
          echo
          echo "Mihomo commit:"
          git rev-parse HEAD
          echo
          echo "Mihomo source:"
          git remote -v
          echo
          echo "Checking go.mod..."
          test -f go.mod
          ls -la go.mod

      # --------------------------------------------------------
      # Setup Go（使用固定版本，更稳定）
      # --------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'          # 或 '1.22' / '1.24'，按 Mihomo 实际要求调整
          cache: true
          cache-dependency-path: ${{ env.MIHOMO_SOURCE }}/go.sum

      # --------------------------------------------------------
      # Environment
      # --------------------------------------------------------
      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "System"
          echo "========================================"
          sw_vers
          echo
          echo "========================================"
          echo "Architecture"
          echo "========================================"
          uname -m
          echo
          echo "========================================"
          echo "Xcode"
          echo "========================================"
          xcodebuild -version
          echo
          echo "========================================"
          echo "Go"
          echo "========================================"
          go version

      # --------------------------------------------------------
      # Download Go dependencies
      # --------------------------------------------------------
      - name: Download Mihomo dependencies
        working-directory: ${{ env.MIHOMO_SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          go mod download

      # --------------------------------------------------------
      # Build Mihomo arm64
      # --------------------------------------------------------
      - name: Build Mihomo darwin arm64
        working-directory: ${{ env.MIHOMO_SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "Building Mihomo"
          echo "GOOS   = darwin"
          echo "GOARCH = arm64"
          echo "========================================"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          MIHOMO_VERSION="$(
            git describe \
              --tags \
              --always \
              --dirty 2>/dev/null \
              || git rev-parse --short HEAD
          )"
          echo "Mihomo version: ${MIHOMO_VERSION}"
          echo "Build time: ${BUILD_TIME}"
          CGO_ENABLED=0 \
          GOOS=darwin \
          GOARCH=arm64 \
          go build \
            -tags with_gvisor \
            -trimpath \
            -ldflags "\
              -s -w \
              -X github.com/metacubex/mihomo/constant.Version=${MIHOMO_VERSION} \
              -X github.com/metacubex/mihomo/constant.BuildTime=${BUILD_TIME} \
            " \
            -o "../../${CORE_DIR}/arm64/mihomo"

      # --------------------------------------------------------
      # Make executable
      # --------------------------------------------------------
      - name: Prepare Mihomo binary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${CORE_DIR}/arm64/mihomo"

      # --------------------------------------------------------
      # Verify binary
      # --------------------------------------------------------
      - name: Verify Mihomo arm64
        shell: bash
        run: |
          set -euo pipefail
          BINARY="${CORE_DIR}/arm64/mihomo"
          echo "========================================"
          echo "File"
          echo "========================================"
          file "${BINARY}"
          echo
          echo "========================================"
          echo "Architecture"
          echo "========================================"
          file "${BINARY}" | grep -E "arm64|ARM64"
          echo
          echo "========================================"
          echo "Mihomo version"
          echo "========================================"
          "${BINARY}" -v || true
          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"
          shasum -a 256 "${BINARY}"

      # --------------------------------------------------------
      # Create metadata
      # --------------------------------------------------------
      - name: Create Mihomo metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DIST_DIR}"
          MIHOMO_COMMIT="$(
            git -C "${MIHOMO_SOURCE}" rev-parse HEAD
          )"
          MIHOMO_VERSION="$(
            "${CORE_DIR}/arm64/mihomo" -v 2>&1 \
              | head -n 1 \
              || true
          )"
          SHA256="$(
            shasum -a 256 "${CORE_DIR}/arm64/mihomo" \
              | awk '{print $1}'
          )"
          cat > "${DIST_DIR}/mihomo-metadata.txt" <<EOF
          Hako Client Mihomo Core

          Repository:
          ${MIHOMO_REPOSITORY}

          Ref:
          ${MIHOMO_REF}

          Commit:
          ${MIHOMO_COMMIT}

          Architecture:
          darwin/arm64

          Version:
          ${MIHOMO_VERSION}

          SHA256:
          ${SHA256}

          Build Time:
          $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          EOF
          cat "${DIST_DIR}/mihomo-metadata.txt"

      # --------------------------------------------------------
      # Upload Mihomo artifact
      # --------------------------------------------------------
      - name: Upload Mihomo arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: hako-mihomo-darwin-arm64
          path: |
            Core/mihomo/arm64/mihomo
            dist/mihomo-metadata.txt
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # 2. Build Hako Client
  # ============================================================
  build-hakoclient:
    name: Build Hako Client
    needs:
      - build-mihomo
    runs-on: macos-latest

    steps:
      # --------------------------------------------------------
      # Checkout Hako Client
      # --------------------------------------------------------
      - name: Checkout Hako Client
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Download Mihomo
      # --------------------------------------------------------
      - name: Download Mihomo arm64
        uses: actions/download-artifact@v4
        with:
          name: hako-mihomo-darwin-arm64
          path: .artifact/mihomo

      # --------------------------------------------------------
      # Install Mihomo into project
      # --------------------------------------------------------
      - name: Install Mihomo core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CORE_DIR}/arm64"
          cp \
            ".artifact/mihomo/mihomo" \
            "${CORE_DIR}/arm64/mihomo"
          chmod +x \
            "${CORE_DIR}/arm64/mihomo"
          echo "Installed:"
          ls -lah "${CORE_DIR}/arm64/"

      # --------------------------------------------------------
      # Verify project
      # --------------------------------------------------------
      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "Project"
          echo "========================================"
          test -f "${PROJECT}"
          echo
          echo "========================================"
          echo "Mihomo"
          echo "========================================"
          test -x "${CORE_DIR}/arm64/mihomo"
          file "${CORE_DIR}/arm64/mihomo"
          file "${CORE_DIR}/arm64/mihomo" \
            | grep -E "arm64|ARM64"

      # --------------------------------------------------------
      # Xcode information
      # --------------------------------------------------------
      - name: Xcode information
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          echo
          echo "Available schemes:"
          xcodebuild \
            -project "${PROJECT}" \
            -list

      # --------------------------------------------------------
      # Clean
      # --------------------------------------------------------
      - name: Clean Xcode build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"
          mkdir -p "${DIST_DIR}"
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -sdk macosx \
            -derivedDataPath "${BUILD_DIR}/DerivedData" \
            clean

      # --------------------------------------------------------
      # Build
      # No Apple Developer Account required.
      # --------------------------------------------------------
      - name: Build Hako Client
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "${BUILD_DIR}/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      # --------------------------------------------------------
      # Test
      # --------------------------------------------------------
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "${BUILD_DIR}/TestDerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test

      # --------------------------------------------------------
      # Locate app
      # --------------------------------------------------------
      - name: Locate HakoClient.app
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for HakoClient.app..."
          find "${BUILD_DIR}" \
            -type d \
            -name "HakoClient.app" \
            -print

      # --------------------------------------------------------
      # Validate application
      # --------------------------------------------------------
      - name: Validate HakoClient.app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(
            find "${BUILD_DIR}/DerivedData/Build/Products" \
              -type d \
              -name "HakoClient.app" \
              | head -n 1
          )"
          if [ -z "${APP}" ]; then
            echo "ERROR: HakoClient.app not found"
            exit 1
          fi
          echo "App:"
          echo "${APP}"
          echo
          echo "========================================"
          echo "Application"
          echo "========================================"
          ls -lah "${APP}"
          echo
          echo "========================================"
          echo "Executable"
          echo "========================================"
          file "${APP}/Contents/MacOS/HakoClient"
          echo
          echo "========================================"
          echo "Mihomo"
          echo "========================================"
          MIHOMO="${APP}/Contents/Resources/Core/mihomo/arm64/mihomo"
          if [ ! -f "${MIHOMO}" ]; then
            echo "ERROR: Mihomo was not bundled into the application"
            echo
            echo "Searching application bundle:"
            find "${APP}/Contents" \
              -type f \
              -name "mihomo" \
              -print
            exit 1
          fi
          file "${MIHOMO}"
          file "${MIHOMO}" \
            | grep -E "arm64|ARM64"
          test -x "${MIHOMO}"
          echo
          echo "Mihomo successfully bundled."

      # --------------------------------------------------------
      # Inspect bundle
      # --------------------------------------------------------
      - name: Inspect application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="$(
            find "${BUILD_DIR}/DerivedData/Build/Products" \
              -type d \
              -name "HakoClient.app" \
              | head -n 1
          )"
          echo "Bundle structure:"
          find "${APP}/Contents" \
            -maxdepth 5 \
            -print

      # --------------------------------------------------------
      # Code signing inspection
      # This is informational only.
      # --------------------------------------------------------
      - name: Inspect code signature
        shell: bash
        run: |
          set +e
          APP="$(
            find "${BUILD_DIR}/DerivedData/Build/Products" \
              -type d \
              -name "HakoClient.app" \
              | head -n 1
          )"
          codesign \
            --display \
            --verbose=4 \
            "${APP}"
          true

      # --------------------------------------------------------
      # Package application
      # --------------------------------------------------------
      - name: Package Hako Client
        shell: bash
        run: |
          set -euo pipefail
          APP="$(
            find "${BUILD_DIR}/DerivedData/Build/Products" \
              -type d \
              -name "HakoClient.app" \
              | head -n 1
          )"
          if [ -z "${APP}" ]; then
            echo "ERROR: HakoClient.app not found"
            exit 1
          fi
          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "${APP}/Contents/Info.plist" \
              2>/dev/null \
              || echo "0.1"
          )"
          ARCH="arm64"
          ZIP_NAME="HakoClient-v${VERSION}-macOS-${ARCH}.zip"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "${APP}" \
            "${DIST_DIR}/${ZIP_NAME}"
          echo "Created:"
          ls -lh "${DIST_DIR}/${ZIP_NAME}"

      # --------------------------------------------------------
      # SHA256
      # --------------------------------------------------------
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "${DIST_DIR}"
          shasum -a 256 \
            *.zip \
            > SHA256SUMS
          cat SHA256SUMS

      # --------------------------------------------------------
      # Build metadata
      # --------------------------------------------------------
      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          APP="$(
            find "${BUILD_DIR}/DerivedData/Build/Products" \
              -type d \
              -name "HakoClient.app" \
              | head -n 1
          )"
          APP_VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "${APP}/Contents/Info.plist" \
              2>/dev/null \
              || echo "unknown"
          )"
          APP_BUILD="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "${APP}/Contents/Info.plist" \
              2>/dev/null \
              || echo "unknown"
          )"
          cat > "${DIST_DIR}/build-metadata.txt" <<EOF
          Hako Client Build

          Application:
          HakoClient

          Version:
          ${APP_VERSION}

          Build:
          ${APP_BUILD}

          Configuration:
          ${CONFIGURATION}

          Architecture:
          arm64

          Platform:
          macOS

          Mihomo:
          darwin/arm64

          Mihomo Source:
          ${MIHOMO_REPOSITORY}

          Mihomo Ref:
          ${MIHOMO_REF}

          Build Time:
          $(date -u '+%Y-%m-%dT%H:%M:%SZ')

          Signing:
          Unsigned

          Apple Developer Program:
          Not required for v0.1 build
          EOF
          cat "${DIST_DIR}/build-metadata.txt"

      # --------------------------------------------------------
      # Upload final artifact
      # --------------------------------------------------------
      - name: Upload Hako Client artifact
        uses: actions/upload-artifact@v4
        with:
          name: hako-client-macos-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/build-metadata.txt
            dist/mihomo-metadata.txt
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------
      # Upload diagnostics if build fails
      # --------------------------------------------------------
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hako-client-build-diagnostics
          path: |
            build/
            Core/mihomo/
          if-no-files-found: ignore
          retention-days: 7