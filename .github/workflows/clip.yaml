name: Clip

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone CNB repository
        run: |
          git clone --depth 1 https://cnb.cool/cnmeeia/ClipBoard.git ClipBoard

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'ClipBoard/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ClipBoard
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ClipBoard
        run: pnpm run build
      - name: Deploy
        working-directory: ClipBoard
        run: |
          set -o pipefail
      
          pnpm run deploy 2>&1 | tee deploy.log
      
          # 提取 Cloudflare Worker Version ID
          VERSION_ID=$(grep -oE 'Current Version ID: [a-f0-9-]+' deploy.log | head -1 | sed 's/Current Version ID: //')
      
          if [ -z "$VERSION_ID" ]; then
            echo "❌ 无法获取 Cloudflare Worker Version ID"
            exit 1
          fi
      
          echo "Cloudflare Worker Version ID: $VERSION_ID"
          echo "VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
      
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      
      - name: Bark Notification
        if: success()
        run: |
          echo "📱 Sending Bark notification..."
      
          curl -G --fail-with-body \
            --data-urlencode "title=☁️ CloudClipboard 部署成功" \
            --data-urlencode "body=Worker: cloudclipboard
          Version ID: ${VERSION_ID}
          Domain: clip.0272.de5.net" \
                --data-urlencode "group=CloudClipboard" \
                --data-urlencode "url=https://clip.0272.de5.net" \
                "${BARK_URL}/${BARK_TOKEN}"
          
              echo "✅ Bark notification sent"
          
            env:
              BARK_URL: ${{ secrets.BARK_URL }}
              BARK_TOKEN: ${{ secrets.BARK_TOKEN }}
