name: Clip

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone CNB repository
        run: |
          git clone --depth 1 https://cnb.cool/cnmeeia/ClipBoard.git ClipBoard

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'ClipBoard/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ClipBoard
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ClipBoard
        run: pnpm run build

      - name: Deploy
        working-directory: ClipBoard
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
